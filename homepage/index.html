<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace, sans-serif;
            background: url('Minecraft.png') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            background: rgba(0, 0, 0, 0.45);
            padding: 40px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .title-box {
            background-color: #ffffff;
            border: 4px solid #000000;
            padding: 15px 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 6px 0px #000000;
        }

        .title-box h1 {
            color: #000000;
            font-size: 20px;
            line-height: 1.5;
            letter-spacing: 1px;
        }

        .search-options {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
        }

        .search-card {
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 8px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 6px 0px #000000;
            text-decoration: none;
            width: 240px;
            height: 100px;
        }

        .search-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0px #000000;
        }

        .search-card:active {
            transform: translateY(2px);
            box-shadow: 0 4px 0px #000000;
        }

        .search-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title-box">
            <h1>Choose a Search Engine</h1>
        </div>

        <div class="search-options">
            <a href="https://www.google.com" class="search-card">
                <img src="old google logo.jpeg" alt="Google">
            </a>

            <a href="https://duckduckgo.com" class="search-card">
                <img src="duckduckgo.png" alt="DuckDuckGo">
            </a>
        </div>
    </div>

</body>
</html>
